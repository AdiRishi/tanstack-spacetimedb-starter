name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install SpacetimeDB CLI
        env:
          SPACETIMEDB_VERSION: 2.8.2
        run: |
          curl -sSf https://install.spacetimedb.com | sh
          "$HOME/.local/bin/spacetime" version install "$SPACETIMEDB_VERSION" --yes --use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: pnpm format --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build SpacetimeDB module
        run: spacetime build

      - name: Verify generated bindings
        run: |
          pnpm spacetime:generate
          git diff --exit-code -- src/module_bindings

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
